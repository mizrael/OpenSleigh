version: 2.1
jobs:
  build:
    resource_class: large
    environment:
      TARGET_FRAMEWORK: net9.0

    docker:
      - image: mcr.microsoft.com/dotnet/sdk:9.0.203
      - image: mongo:latest       
      - image: rabbitmq:3-management-alpine
        environment:
          RABBITMQ_DEFAULT_VHOST: "/opensleigh-tests"
      - image: 'mcr.microsoft.com/mssql/server:2022-latest'
        environment:
          SA_PASSWORD: "Sup3r_p4ssword123"
          ACCEPT_EULA: "Y"
      - image: 'postgres:13.4'
        environment:
          POSTGRES_PASSWORD: "Sup3r_p4ssword123"      
      - image: 'apache/kafka:latest'
        name: broker
        environment:
          KAFKA_BROKER_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_NODE_ID: 1
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
          KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    steps:
      - run: apt-get update && apt-get install -y openssh-client
      - checkout    
      - run:
          name: Build      
          command: |            
            cd ./src
            dotnet build 
      - run:
          name: Unit tests
          command: |
            cd ./src            
            dotnet test --framework $TARGET_FRAMEWORK --filter "Category!=E2E&Category!=Integration"
      - run:
          name: Integration tests
          command: |
            cd ./src            
            dotnet test --framework $TARGET_FRAMEWORK --filter "FullyQualifiedName!~Cosmos&Category=Integration"

      #- run: # skipping E2E tests for now
      #    name: E2E tests
      #    command: |            
      #      dotnet test --filter "Category=E2E"           

  sonarscan:
    resource_class: large
    environment:
      TARGET_FRAMEWORK: net9.0
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:9.0.203
      - image: 'mongo:latest'        
      - image: 'rabbitmq:3-management-alpine'
        environment:
          RABBITMQ_DEFAULT_VHOST: "/opensleigh-tests"
      - image: 'mcr.microsoft.com/mssql/server:2022-latest'
        environment:
          SA_PASSWORD: "Sup3r_p4ssword123"
          ACCEPT_EULA: "Y"
      - image: 'postgres:13.4'
        environment:
          POSTGRES_PASSWORD: "Sup3r_p4ssword123"
      - image: 'apache/kafka:latest'
        name: broker
        environment:
          KAFKA_BROKER_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_NODE_ID: 1
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
          KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    steps:
      - run: apt-get update && apt-get install -y openssh-client
      - checkout

      - run:
          name: run sonarcloud
          command: |            
            export PATH="$PATH:/root/.dotnet/tools" 
            apt-get update && apt-get install -y default-jdk
            dotnet tool install --global dotnet-sonarscanner
            dotnet tool install --global coverlet.console                        
            dotnet-sonarscanner begin \
              /k:"mizrael_OpenSleigh" \
              /o:"mizrael" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.login="$SONAR_TOKEN" \
              /d:sonar.cs.opencover.reportsPaths="**\coverage.opencover.xml"                                         
            dotnet test ./src/OpenSleigh.sln --framework $TARGET_FRAMEWORK --filter "FullyQualifiedName!~Cosmos&Category!=E2E" /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=coverage.opencover.xml  
            dotnet-sonarscanner end /d:sonar.login="$SONAR_TOKEN"

workflows:
  build_and_test:
    jobs:
      - build
  sonarscan:
    jobs:
      - sonarscan:
          context: SonarCloud
