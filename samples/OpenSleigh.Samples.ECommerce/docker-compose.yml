name: openSleigh.samples.ecommerce

services:
  openSleigh.samples.ecommerce.postgresql:
    container_name: openSleigh.Sample10.infrastructure.postgresql    
    image: "postgres:13.4"
    environment:
      POSTGRES_PASSWORD: "Sup3r_p4ssword123"
    ports:
      - 5432:5432     
  
  openSleigh.samples.ecommerce.rabbitmq:        
    image: rabbitmq:3-management-alpine
    container_name: openSleigh.Sample10.infrastructure.rabbitmq    
    restart: always
    environment:
     RABBITMQ_DEFAULT_VHOST: "/opensleigh-samples-ecommerce"
    ports:     
      - "15671:15671"
      - "15672:15672"   
      - "5672:5672"